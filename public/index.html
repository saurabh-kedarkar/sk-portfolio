<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="https://res.cloudinary.com/dnvmzutlo/image/upload/f_auto,q_auto,w_100/v1735191319/sk-logo_xqas3i.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
  <meta name="theme-color" content="#090d16" />
  <title>Saurabh Kedarkar | Web Developer</title>
  <meta name="description" content="Saurabh Kedarkar - Web Developer & WordPress Specialist with 3+ years experience building fast, responsive, high-performance web applications.">
  <meta name="google-site-verification" content="RZvCCPJrwa0PXgDxcymE3a6RJoe7RT3QQWTwUot8FRA" />

  <!-- Resource Preconnects for Ultra Fast Loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="dns-prefetch" href="https://res.cloudinary.com">

  <!-- Google Fonts with display=swap -->
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="apple-touch-icon" href="https://res.cloudinary.com/dnvmzutlo/image/upload/f_auto,q_auto,w_180/v1735191319/sk-logo_xqas3i.jpg" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <style>
    /* Critical Inline CSS for Zero FCP Blank Screen */
    body {
      margin: 0;
      padding: 0;
      background-color: #090d16;
      color: #f8fafc;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    #root-loading-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100vw;
      background: #090d16;
      position: fixed;
      inset: 0;
      z-index: 99999;
    }
    .splash-logo-box {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: rgba(6, 182, 212, 0.1);
      border: 1.5px solid rgba(6, 182, 212, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      color: #06b6d4;
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.25);
      animation: pulseGlow 1.5s infinite alternate ease-in-out;
    }
    .splash-loader-bar {
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      margin-top: 24px;
      overflow: hidden;
      position: relative;
    }
    .splash-loader-progress {
      position: absolute;
      left: -100%;
      top: 0;
      bottom: 0;
      width: 100%;
      background: linear-gradient(90deg, transparent, #06b6d4, transparent);
      animation: splashSlide 1.2s infinite ease-in-out;
    }
    @keyframes pulseGlow {
      0% { transform: scale(0.96); opacity: 0.8; }
      100% { transform: scale(1.04); opacity: 1; box-shadow: 0 0 35px rgba(6, 182, 212, 0.45); }
    }
    @keyframes splashSlide {
      0% { left: -100%; }
      100% { left: 100%; }
    }
  </style>
</head>

<body>
  <div id="root">
    <!-- Instant Fallback Skeleton Loader while React initial JavaScript parses -->
    <div id="root-loading-splash">
      <div class="splash-logo-box">SK</div>
      <div class="splash-loader-bar">
        <div class="splash-loader-progress"></div>
      </div>
    </div>
  </div>
</body>

</html>
